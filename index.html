<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>限定公開ドキュメント</title>
  <script>
    const password = prompt("パスワードを入力してください:");
    if (password !== "Password123!") { // 設定したいパスワード
      alert("パスワードが違います。");
      window.location.href = "about:blank";
    }
  </script>
</head>
<body>
  <h1>限定公開ドキュメント</h1>
  <p>ここに閲覧を制限したい内容を記述します。</p>
</body>
</html>
